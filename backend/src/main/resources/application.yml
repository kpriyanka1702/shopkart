server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: shopkart-backend
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:shopkart}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USER:shopkart}
    password: ${DB_PASSWORD:shopkartpass}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  sql:
    init:
      mode: always

app:
  jwt:
    # Loaded from environment — never hardcode secrets in source (see README).
    secret: ${JWT_SECRET}
    expiration-ms: 86400000
  payment:
    # Signing key for the LOCAL MOCK gateway only (simulated, no real money).
    # Override via env in any shared/prod environment.
    secret: ${PAYMENT_GATEWAY_SECRET:shopkart-local-mock-gateway-key}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

logging:
  level:
    com.shopkart: INFO
