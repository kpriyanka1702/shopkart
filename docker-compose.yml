services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: shopkart
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpass}
      MYSQL_USER: ${DB_USER:-shopkart}
      MYSQL_PASSWORD: ${DB_PASSWORD:-shopkartpass}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: shopkart
      DB_USER: ${DB_USER:-shopkart}
      DB_PASSWORD: ${DB_PASSWORD:-shopkartpass}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret-change-me-to-a-long-random-string-value}
      PAYMENT_GATEWAY_SECRET: ${PAYMENT_GATEWAY_SECRET:-local-mock-gateway-signing-key}
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mysql_data:
