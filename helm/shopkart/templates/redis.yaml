{{- if .Values.redis.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shopkart-redis
  labels:
    app: shopkart-redis
    {{- include "shopkart.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shopkart-redis
  template:
    metadata:
      labels:
        app: shopkart-redis
    spec:
      containers:
        - name: redis
          image: {{ .Values.redis.image }}
          ports:
            - containerPort: 6379
          resources:
            {{- toYaml .Values.redis.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: shopkart-redis
  labels:
    app: shopkart-redis
    {{- include "shopkart.labels" . | nindent 4 }}
spec:
  selector:
    app: shopkart-redis
  ports:
    - port: 6379
      targetPort: 6379
{{- end }}
