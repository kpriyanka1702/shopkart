apiVersion: v1
kind: Secret
metadata:
  name: shopkart-secrets
  labels:
    {{- include "shopkart.labels" . | nindent 4 }}
type: Opaque
stringData:
  JWT_SECRET: {{ required "secrets.jwtSecret is required (set via --set)" .Values.secrets.jwtSecret | quote }}
  PAYMENT_GATEWAY_SECRET: {{ required "secrets.paymentGatewaySecret is required" .Values.secrets.paymentGatewaySecret | quote }}
  DB_USER: {{ .Values.secrets.dbUser | quote }}
  DB_PASSWORD: {{ required "secrets.dbPassword is required" .Values.secrets.dbPassword | quote }}
  DB_ROOT_PASSWORD: {{ required "secrets.dbRootPassword is required" .Values.secrets.dbRootPassword | quote }}
