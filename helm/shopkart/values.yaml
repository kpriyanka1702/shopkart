namespace: shopkart

backend:
  image:
    repository: ghcr.io/your-org/shopkart-backend
    tag: latest
    pullPolicy: IfNotPresent
  replicas: 2
  port: 8080
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 768Mi
  env:
    DB_HOST: shopkart-mysql
    DB_PORT: "3306"
    DB_NAME: shopkart
    REDIS_HOST: shopkart-redis
    REDIS_PORT: "6379"
    CORS_ALLOWED_ORIGINS: "http://shopkart.local"

frontend:
  image:
    repository: ghcr.io/your-org/shopkart-frontend
    tag: latest
    pullPolicy: IfNotPresent
  replicas: 2
  port: 80
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi

mysql:
  enabled: true
  image: mysql:8.0
  database: shopkart
  storage: 2Gi
  resources:
    requests:
      cpu: 250m
      memory: 512Mi

redis:
  enabled: true
  image: redis:7-alpine
  resources:
    requests:
      cpu: 50m
      memory: 64Mi

# Secrets are provided at deploy time via --set or a sealed secret.
# NEVER commit real secret values to source control.
secrets:
  jwtSecret: ""             # required: set with --set secrets.jwtSecret=...
  paymentGatewaySecret: ""  # required: signing key for the mock payment gateway
  dbUser: shopkart
  dbPassword: ""            # required
  dbRootPassword: ""        # required

ingress:
  enabled: true
  className: nginx
  host: shopkart.local
